<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo</title> <!-- troque pelo nome do seu site/jogo -->
<style>
  :root {
    --bg-void: #05070c;
    --bg-panel: #0d121b;
    --line: #1c2733;
    --accent: #00e5ff;
    --accent-dim: rgba(0, 229, 255, 0.35);
    --text: #c9d8e3;
    --text-mute: #5c7186;
    --font-hud: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-void);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden; /* evita rolagem acidental da página em volta do jogo */
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- Barra superior ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 16px;
    height: 56px;
    flex: 0 0 56px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--line);
  }

  .tabs {
    display: flex;
    gap: 4px;
    height: 100%;
  }

  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-mute);
    font-family: var(--font-hud);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0 18px;
    height: 100%;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .map-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    appearance: none;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-hud);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 3px;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .map-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 229, 255, 0.06);
  }
  .map-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .map-btn svg { width: 16px; height: 16px; flex: none; }

  /* ---------- Painel do jogo ---------- */
  .tab-panels {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }
  .tab-panel {
    display: none;
    height: 100%;
  }
  .tab-panel.active { display: block; }

  .game-frame-wrap {
    position: relative;
    height: 100%;
    background: #000;
  }

  .game-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Moldura HUD nos cantos do visor do jogo */
  .hud-corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--accent-dim);
    pointer-events: none;
    z-index: 2;
  }
  .hud-tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .hud-tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .hud-bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .hud-br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .fullscreen-btn {
    position: absolute;
    right: 16px;
    bottom: 16px;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    appearance: none;
    cursor: pointer;
    background: rgba(5, 7, 12, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px;
    border-radius: 4px;
    transition: border-color .15s ease, color .15s ease;
  }
  .fullscreen-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .fullscreen-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .fullscreen-btn svg { width: 18px; height: 18px; display: block; }

  @media (max-width: 560px) {
    .map-btn span { display: none; } /* só o ícone em telas bem pequenas */
    .tab { padding: 0 12px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <nav class="tabs" role="tablist" aria-label="Navegação do site">
        <button
          class="tab active"
          id="tab-jogo"
          role="tab"
          aria-selected="true"
          aria-controls="panel-jogo"
          data-tab="jogo"
          type="button"
        >Jogo</button>
        <!--
          COMO ADICIONAR MAIS ABAS:
          1) Duplique o <button class="tab"> acima, trocando id, aria-controls,
             data-tab e o texto (ex: id="tab-sobre", data-tab="sobre").
          2) Duplique a <section class="tab-panel"> lá embaixo, trocando
             id e data-tab pelos mesmos valores usados no botão.
          O JavaScript no final do arquivo já cuida de alternar entre elas.
        -->
      </nav>

      <button class="map-btn" id="btnMapa" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s-7-6.13-7-11a7 7 0 0 1 14 0c0 4.87-7 11-7 11z"></path>
          <circle cx="12" cy="10" r="2.5"></circle>
        </svg>
        <span>Abrir Mapa</span>
      </button>
    </header>

    <main class="tab-panels">
      <section class="tab-panel active" id="panel-jogo" role="tabpanel" aria-labelledby="tab-jogo" data-tab="jogo">
        <div class="game-frame-wrap" id="gameWrap">
          <div class="hud-corner hud-tl"></div>
          <div class="hud-corner hud-tr"></div>
          <div class="hud-corner hud-bl"></div>
          <div class="hud-corner hud-br"></div>

          <!--
            src="./jogo/index.html" -> TROQUE pelo caminho real do seu jogo
            dentro do repositório (ex: "./meu-jogo/index.html", "./build/index.html").
            Precisa ser um caminho relativo/local (mesma origem do site) para
            a captura de teclado dentro do jogo funcionar (veja o JS abaixo).
          -->
          <iframe
            id="gameFrame"
            src="./Eaglercraft_1.12_Offline_en_US.html"
            title="Minecraft"
            allow="fullscreen; autoplay; gamepad"
            allowfullscreen
          ></iframe>

          <button class="fullscreen-btn" id="btnFullscreen" type="button" aria-label="Alternar tela cheia">
            <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 9V4h5"></path>
              <path d="M20 9V4h-5"></path>
              <path d="M4 15v5h5"></path>
              <path d="M20 15v5h-5"></path>
            </svg>
            <svg id="fsIconCompress" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 4v5H4"></path>
              <path d="M15 4v5h5"></path>
              <path d="M9 20v-5H4"></path>
              <path d="M15 20v-5h5"></path>
            </svg>
          </button>
        </div>
      </section>
    </main>
  </div>

<script>
(() => {
  'use strict';

  /* ========================================================================
     CONFIGURAÇÕES — EDITE AQUI
     ======================================================================== */

  // Link que abre em nova aba do navegador ao clicar em "Abrir Mapa"
  const MAP_URL = 'http://206.221.176.168:50763';

  // O caminho do jogo é definido no atributo src do <iframe id="gameFrame">
  // lá em cima no HTML (procure por "jogo/index.html").

  /* ======================================================================== */

  const gameWrap = document.getElementById('gameWrap');
  const gameFrame = document.getElementById('gameFrame');
  const btnFullscreen = document.getElementById('btnFullscreen');
  const iconExpand = document.getElementById('fsIconExpand');
  const iconCompress = document.getElementById('fsIconCompress');
  const btnMapa = document.getElementById('btnMapa');

  /* ---------- Botão "Abrir Mapa" ---------- */
  btnMapa.addEventListener('click', () => {
    window.open(MAP_URL, '_blank', 'noopener,noreferrer');
  });

  /* ---------- Tela cheia ----------
     Tenta pedir tela cheia já solicitando o "keyboard lock" do navegador,
     que permite ao jogo receber combinações como Ctrl/Alt + letra em vez
     de o navegador interceptá-las primeiro. Suporte hoje: apenas
     navegadores baseados em Chromium (Chrome, Edge, Opera) — em outros
     (Firefox, Safari) cai automaticamente para a tela cheia comum. */
  async function enterFullscreen() {
    try {
      await gameWrap.requestFullscreen({ keyboardLock: 'browser' });
    } catch (err) {
      try {
        await gameWrap.requestFullscreen();
      } catch (err2) {
        console.warn('Não foi possível entrar em tela cheia:', err2);
        return;
      }
      // Fallback para navegadores que só suportam a API separada mais antiga
      if (navigator.keyboard && navigator.keyboard.lock) {
        navigator.keyboard.lock().catch(() => {});
      }
    }
  }

  function exitFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
  }

  btnFullscreen.addEventListener('click', () => {
    if (document.fullscreenElement) exitFullscreen();
    else enterFullscreen();
  });

  document.addEventListener('fullscreenchange', () => {
    const isFs = !!document.fullscreenElement;
    iconExpand.hidden = isFs;
    iconCompress.hidden = !isFs;
    if (!isFs && navigator.keyboard && navigator.keyboard.unlock) {
      navigator.keyboard.unlock();
    }
    if (isFs) gameFrame.focus(); // já entrega o foco pro jogo
  });

  /* ---------- Captura de teclas arriscadas ----------
     LEIA ISTO: por segurança, nenhum site consegue interceptar de verdade
     atalhos como Ctrl+W, Ctrl+T, Alt+F4 ou Cmd+Q — isso é bloqueado de
     propósito pelo próprio navegador, e nenhum código JavaScript (nem
     este aqui) consegue driblar essa proteção. O que este arquivo faz:
       1) usa a Keyboard Lock API acima, que no Chrome/Edge realmente
          entrega essas combinações pro jogo em vez do navegador, mas só
          durante a tela cheia;
       2) bloqueia teclas que o JavaScript sempre pode interceptar
          (Backspace voltando página, espaço/setas rolando a tela, F5
          atualizando);
       3) mostra uma confirmação nativa antes de fechar a aba (mais abaixo),
          que cobre justamente o "fechar sem querer" no Ctrl+W. */
  function shouldBlock(e) {
    const k = e.key;
    const tag = e.target && e.target.tagName;
    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA';
    const ctrlOrCmd = e.ctrlKey || e.metaKey;

    if (ctrlOrCmd && ['w', 't', 'n', 'r', 'p', 's', 'd', 'l', 'k', 'j', 'h'].includes(k.toLowerCase())) return true;
    if (['F5', 'F6', 'F11'].includes(k)) return true;
    if (k === 'Backspace' && !isTyping) return true;
    if ([' ', 'PageUp', 'PageDown', 'Home', 'End'].includes(k) && !isTyping) return true;
    return false;
    // Shift e Ctrl sozinhos (sem outra tecla) nunca disparam ações do
    // navegador, então não precisam ser bloqueados aqui — o jogo já
    // recebe esses eventos normalmente.
  }

  function guardKeydown(e) {
    if (!document.fullscreenElement) return; // só age durante o jogo em tela cheia
    if (shouldBlock(e)) e.preventDefault();
  }

  // Guarda na própria página (cobre o momento em que o foco está fora do iframe)
  window.addEventListener('keydown', guardKeydown, true);

  // Tenta anexar a mesma guarda DENTRO do iframe do jogo — só é possível
  // porque o jogo é local, na mesma origem do site. Se o src do iframe for
  // trocado para uma URL de outra origem, isso falha silenciosamente (é
  // uma restrição de segurança do navegador, não um bug deste código).
  gameFrame.addEventListener('load', () => {
    try {
      gameFrame.contentWindow.document.addEventListener('keydown', guardKeydown, true);
    } catch (err) {
      console.log('Jogo em outra origem — captura de teclas dentro do iframe não é possível.');
    }
  });

  /* ---------- Evita fechar a aba sem querer ----------
     Mostra a confirmação nativa do navegador antes de fechar a aba,
     atualizar a página ou navegar para outro site. Funciona em todos os
     navegadores (mesmo os sem suporte a Keyboard Lock) e é o que realmente
     resolve o "fechar sem querer" no Ctrl+W ou no X da aba. O texto da
     mensagem é definido pelo próprio navegador; não dá para customizá-lo. */
  window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = '';
  });

  /* ---------- Sistema de abas ----------
     Só existe uma aba (Jogo) por enquanto, mas já preparado para receber
     mais — veja o comentário "COMO ADICIONAR MAIS ABAS" no HTML. */
  const tabButtons = document.querySelectorAll('.tab');
  const tabPanels = document.querySelectorAll('.tab-panel');

  tabButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      tabButtons.forEach((b) => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      tabPanels.forEach((p) => p.classList.remove('active'));

      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });
})();
</script>
</body>
</html>
